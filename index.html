<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ✅ PRIMARY TITLE (Shows in Google Search Results) -->
    <title>Scentify Perfume - Shop Luxury Perfumes & Fragrances Online in Pakistan</title>
    
    <!-- ✅ META DESCRIPTION (Shows below title in Google) -->
    <meta name="description" content="Discover premium luxury perfumes at Scentify. Shop authentic fragrances for men and women with free delivery across Pakistan. Best prices guaranteed." />
    
    <!-- ✅ KEYWORDS (Helps SEO) -->
    <meta name="keywords" content="Scentify, perfume, luxury perfume, fragrances, Pakistan perfume, men's perfume, women's perfume, premium fragrance, authentic perfume" />
    
    <!-- ✅ AUTHOR -->
    <meta name="author" content="Scentify Perfume" />
    
    <!-- ✅ ROBOTS (Tells Google to index your site) -->
    <meta name="robots" content="index, follow" />
    
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- ✅ OPEN GRAPH (For social media sharing - Facebook, WhatsApp, etc.) -->
    <meta property="og:title" content="Scentify Perfume - Shop Luxury Perfumes & Fragrances" />
    <meta property="og:description" content="Discover premium luxury perfumes at Scentify. Shop authentic fragrances for men and women with free delivery across Pakistan." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.scentifypurfume.com/" />
    <meta property="og:image" content="https://www.scentifypurfume.com/og-image.jpg" /> <!-- Add your logo/banner image URL -->
    
    <!-- ✅ TWITTER CARD (For Twitter sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scentify Perfume - Shop Luxury Perfumes & Fragrances" />
    <meta name="twitter:description" content="Discover premium luxury perfumes at Scentify. Shop authentic fragrances for men and women with free delivery across Pakistan." />
    <meta name="twitter:image" content="https://www.scentifypurfume.com/og-image.jpg" />
    
    <!-- ✅ CANONICAL URL (Prevents duplicate content issues) -->
    <link rel="canonical" href="https://www.scentifypurfume.com/" />
    
    <!-- ✅ CUSTOM FONTS (Optional - if you're using Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
